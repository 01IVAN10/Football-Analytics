# App theme = chart palette (src/style.py).
# Light theme forced: the charts are PNGs on white and would look like white cards
# on a dark background.
[theme]
base = "light"
primaryColor = "#2A78D6"              # BLUE: active widgets, percentile bars
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"  # sidebar, same as the radar ring fill
textColor = "#1F1F1F"

[global]
# The "Open profile" button sets sidebar widget values through st.session_state on
# purpose, which makes Streamlit log "widget created with a default value but also had
# its value set via Session State". Expected here: session_state wins over the default.
disableWidgetStateDuplicationWarning = true
