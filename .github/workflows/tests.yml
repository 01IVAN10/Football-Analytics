# Runs the test suite on every push to main and on every pull request.
# Streamlit Community Cloud redeploys on every push to main regardless of this
# result. To keep a broken commit out of the live app, work in a branch, open a
# pull request and merge it only when this check is green.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # "Run workflow" button in the Actions tab

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"            # same as the deployed app
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
